name: Validate harness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository and skill manifest
        run: |
          python scripts/validate.py
          python scripts/update_manifest.py --check

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Validate evaluation commands
        run: |
          python scripts/evaluate.py --provider codex --dry-run
          python scripts/evaluate.py --provider claude --dry-run
          python scripts/evaluate_tasks.py --provider codex --dry-run
          python scripts/evaluate_tasks.py --provider claude --dry-run
